# Single-node S3-compatible storage. See docker/README.md for scope and backups.
services:
  better-remote:
    environment:
      BETTER_REMOTE_S3_ENDPOINT: http://seaweedfs:8333
      BETTER_REMOTE_S3_BUCKET: ${BETTER_REMOTE_S3_BUCKET:-better-remotes}
      BETTER_REMOTE_S3_REGION: ${BETTER_REMOTE_S3_REGION:-us-east-1}
      BETTER_REMOTE_S3_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY:?Set SEAWEEDFS_ACCESS_KEY}
      BETTER_REMOTE_S3_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY:?Set SEAWEEDFS_SECRET_KEY}
      BETTER_REMOTE_S3_PATH_STYLE: "true"
    depends_on:
      seaweedfs:
        condition: service_healthy
  seaweedfs:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: [mini, "-dir=/data", "-ip=seaweedfs", "-ip.bind=0.0.0.0", "-admin.ui=false", "-webdav=false", "-s3.port.iceberg=0", "-s3.port.lance=0"]
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY:?Set SEAWEEDFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY:?Set SEAWEEDFS_SECRET_KEY}
      S3_BUCKET: ${BETTER_REMOTE_S3_BUCKET:-better-remotes}
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - better-seaweedfs-data:/data
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8333/status"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped
volumes:
  better-seaweedfs-data:
