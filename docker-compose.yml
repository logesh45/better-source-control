services:
  better-remote:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BETTER_VERSION: ${BETTER_VERSION:-0.1.2}
        BETTER_TARGET: ${BETTER_TARGET:-}
    image: better-source-control/better-remote:${BETTER_VERSION:-0.1.2}
    ports:
      - "${BETTER_REMOTE_PORT:-8787}:8787"
    volumes:
      - better-remote-data:/var/lib/better-remote
    restart: unless-stopped

volumes:
  better-remote-data:
