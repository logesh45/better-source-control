# Container binds 0.0.0.0:8787 (non-loopback). BETTER_REMOTE_AUTH_TOKEN is required
# at startup. Protected routes expect Authorization: Bearer <token>.
# Configure the CLI with --credential-env so the token is read from the
# environment instead of being written into repository metadata. See docker/README.md.
#
# This file is filesystem storage (BETTER_REMOTE_STORAGE / --storage-root).
# Single-node SeaweedFS (requires credentials; loopback S3 port 8333):
#   docker compose -f docker-compose.yml -f docker-compose.seaweedfs.yml up -d --build
# External S3:
#   docker compose -f docker-compose.yml -f docker-compose.s3.yml up -d --build
services:
  better-remote:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BETTER_VERSION: ${BETTER_VERSION:-0.5.0}
        BETTER_TARGET: ${BETTER_TARGET:-}
    image: better-source-control/better-remote:${BETTER_VERSION:-0.5.0}
    environment:
      BETTER_REMOTE_AUTH_TOKEN: ${BETTER_REMOTE_AUTH_TOKEN:?set BETTER_REMOTE_AUTH_TOKEN for non-loopback Docker bind}
      BETTER_REMOTE_STORAGE: /var/lib/better-remote
    ports:
      - "${BETTER_REMOTE_PORT:-8787}:8787"
    volumes:
      - better-remote-data:/var/lib/better-remote
    restart: unless-stopped

volumes:
  better-remote-data:
