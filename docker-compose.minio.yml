# Local-dev MinIO overlay. Not a production self-host default.
#
# Default credentials are better/betterpassword. Host ports 9000 (S3 API) and
# 9001 (console) are published for the developer machine. Override
# MINIO_ROOT_USER / MINIO_ROOT_PASSWORD instead of committing secrets.
#
# This is the only Compose file that pins the MinIO image. Bump process:
# docs/developer-guide.md (Compose MinIO image pin).
#
# Public local-dev:
#   docker compose -f docker-compose.yml -f docker-compose.minio.yml up -d --build
# Developer checkout includes this file from docker-compose.remote.yml.
services:
  better-remote:
    environment:
      BETTER_REMOTE_S3_ENDPOINT: http://minio:9000
      BETTER_REMOTE_S3_BUCKET: ${BETTER_REMOTE_S3_BUCKET:-better-remotes}
      BETTER_REMOTE_S3_REGION: ${BETTER_REMOTE_S3_REGION:-us-east-1}
      BETTER_REMOTE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-better}
      BETTER_REMOTE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-betterpassword}
      BETTER_REMOTE_S3_PATH_STYLE: "true"
    depends_on:
      - minio

  minio:
    # Last official community image published before MinIO went source-only
    # (2025-10). Docker Hub rejects minio/minio pulls; Quay still serves this
    # tag. Digest is the multi-arch manifest list.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-better}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-betterpassword}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - better-minio-data:/data

volumes:
  better-minio-data:
